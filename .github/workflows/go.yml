name: Go

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Test
      run: go test -v ./...
      env:
        TF_ACC: 1
        TF_ACC_TERRAFORM_VERSION: 1.4.4
